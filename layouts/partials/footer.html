<footer class="footer-bg">
  <div class="container">
    <div class="footer">
      <ul class="footer-icons list-inline">
        {{ range site.Params.social }}
        <li class="list-inline-item"><a href="{{ .link | safeURL }}" target="_blank" rel="noopener"><i class="{{ .icon }}"></i></a></li>
        {{ end }}
      </ul>
      <div class="credit content">
        {{ site.Params.copyright | markdownify }}
      </div>
    </div>
  </div>
</footer>
